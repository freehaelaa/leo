<html lang="en">
<head>

<title>Fifty Things I Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE: tender and playful, a love note you can walk around in
   IDEA: a storybook map of your two years, places from the memories turned into little lands
   PICTURE: the whole screen is the world; a small figure wanders it collecting glowing symbols
   COLOUR and TYPE: storybook greens, river blues, valentine red, a gold glint; DM Serif Display, Caveat, Nunito
   LAYOUT: full-screen canvas, a slim heads-up bar on top, a minimap bottom right, cards for memories */
:root{color-scheme:light dark;--ink:light-dark(#3d0d17,#fde6e6);--soft:light-dark(#8a4a55,#d9a3ab);
  --red:#d7263d;--deep:light-dark(#9e1028,#ff5a72);--gold:#f2b134;--card:light-dark(#fffaf6,#3a1119);--line:light-dark(#efc9c4,#5a1d28);--blank:light-dark(#f4c4c4,#4d1520)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#a9d18e;color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none;cursor:pointer}
.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);border-radius:18px;padding:8px 10px 8px 16px;box-shadow:0 6px 24px rgba(40,10,15,.18);z-index:3}
.hud h1{font:400 21px/1.1 "DM Serif Display",Georgia,serif;margin:0;flex:1 1 auto}
.hud h1 em{color:var(--deep)}
.cnt{display:flex;align-items:center;gap:10px;font:800 15px Nunito,sans-serif;white-space:nowrap}
.prog{width:110px;height:8px;background:var(--blank);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .4s}
button.btn{font:800 15px Nunito,sans-serif;min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--deep);background:var(--deep);color:#fff;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--deep)}
button.btn:focus-visible,.x:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#zone{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:rgba(61,13,23,.82);color:#fff;font:800 15px Nunito,sans-serif;padding:8px 16px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .5s;pointer-events:none;z-index:2}
#zone.on{opacity:1}
#mini{position:fixed;right:12px;bottom:12px;width:150px;height:110px;border-radius:12px;border:3px solid #fffaf6;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:2;cursor:pointer;touch-action:none}
#help{position:fixed;left:12px;bottom:12px;max-width:calc(100vw - 190px);background:rgba(61,13,23,.78);color:#fff;font:600 14px/1.35 Nunito,sans-serif;padding:8px 14px;border-radius:14px;z-index:2;transition:opacity .8s}
#help.off{opacity:0;pointer-events:none}
.veil{position:fixed;inset:0;background:rgba(40,5,12,.55);display:none;place-items:center;padding:18px;z-index:5}
.veil.on{display:grid}
.card{background:var(--card);color:var(--ink);border-radius:22px;max-width:480px;width:100%;max-height:calc(100dvh - 36px);overflow:auto;padding:30px 24px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:rise .35s ease-out;position:relative}
@keyframes rise{from{transform:translateY(18px) scale(.96);opacity:0}}
.card .no{font:800 13px Nunito,sans-serif;color:var(--deep)}
.card .sym{font-size:64px;line-height:1;margin:12px auto 2px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.card p.memo{font:700 clamp(26px,5.5vw,32px)/1.2 Caveat,cursive;margin:10px 0 22px;text-wrap:balance}
.card h2,.card h3{font:400 clamp(30px,6vw,40px)/1.1 "DM Serif Display",serif;margin:6px 0 10px;text-wrap:balance}
.card .intro{color:var(--soft);margin:0 0 20px}
.card .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.x{position:absolute;top:8px;right:10px;width:44px;height:44px;border:0;background:none;font-size:26px;color:var(--soft);cursor:pointer;border-radius:50%}
.jr{list-style:none;padding:0;margin:0 0 18px;text-align:left;display:grid;gap:8px}
.jr li{border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 50px;position:relative;font:600 21px/1.2 Caveat,cursive}
.jr li span{position:absolute;left:12px;top:7px;font-size:22px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.jr .zh{font:800 13px Nunito,sans-serif;color:var(--deep);border:0;padding:10px 0 0}
.empty{color:var(--soft);font-style:italic}
.float{position:fixed;bottom:-40px;pointer-events:none;z-index:6;animation:up linear forwards}
.float path{fill:var(--red)}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:.2}}
@media(prefers-reduced-motion:reduce){.card,.float{animation:none!important}}
@media(max-width:600px){.hud h1{font-size:18px;flex-basis:100%}.prog{width:80px}#zone{top:118px}#mini{width:120px;height:88px}#help{max-width:calc(100vw - 160px);font-size:13px}}
</style>
</head>

function show(inner,closable=true){modal=true;card.innerHTML=(closable?`<button class="x" id="x" aria-label="Close">×</button>`:'')+inner;veil.classList.add('on');
 const x=document.getElementById('x');if(x)x.onclick=close;const f=card.querySelector('.btn');if(f)f.focus()}
function close(){veil.classList.remove('on');modal=false;keys={};cv.focus()}
function collect(o){got.push(o.m);save();hud();const z=Z[o.z],zf=z.items.filter(has).length,left=50-got.length;
 show(`<div class="no">Memory ${got.length} of 50 · ${esc(z.name)}</div><div class="sym" aria-hidden="true">${E[o.m]}</div><p class="memo">${esc(M[o.m])}</p>
 <div class="acts"><button class="btn" id="go">${left?'Keep exploring':'I found them all…'}</button></div>
 <div class="no" style="margin-top:14px;color:var(--soft)">${left?`${zf===z.items.length?`That’s everything in ${esc(z.name)}! `:''}${left} still out there`:'That was the last one'}</div>`);
 document.getElementById('go').onclick=left?close:finale}
function journal(){const rows=Z.map(z=>{const f=z.items.filter(has);return `<li class="zh">${esc(z.name)} · ${f.length} of ${z.items.length}</li>`+
  f.map(m=>`<li><span aria-hidden="true">${E[m]}</span>${esc(M[m])}</li>`).join('')}).join('');
 show(`<h2>Journal</h2>${got.length?`<ul class="jr">${rows}</ul>`:`<p class="empty">No memories found yet. Go explore!</p>`}
 <div class="acts"><button class="btn" id="cl">Back to exploring</button><button class="btn ghost" id="rs">Start over</button></div>`);
 document.getElementById('cl').onclick=close;let armed=false;const rs=document.getElementById('rs');
 rs.onclick=()=>{if(!armed){armed=true;rs.textContent='Tap again to reset';return}got=[];save();hud();P.x=START.x;P.y=START.y;GF.x=P.x+36;GF.y=P.y+4;DOGS.forEach((d,i)=>{d.x=P.x-40*(i+1);d.y=P.y+20*(i+1)});close()}}
const HSVG='<svg viewBox="0 0 24 24"><path d="M12 21.3 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5z"/></svg>';
function finale(){show(`<div class="sym" aria-hidden="true">❤️</div><h3>Happy two years</h3>
 <p class="memo">Fifty memories, and I’d choose every single one of them again. Here’s to the next fifty, and the fifty after that. I love you.</p>
 <div class="acts"><button class="btn" id="jr">Read the journal</button><button class="btn ghost" id="cl">Keep wandering</button></div>`);
 document.getElementById('jr').onclick=journal;document.getElementById('cl').onclick=close;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 for(let j=0;j<40;j++){const d=document.createElement('div');d.className='float';const s=14+Math.random()*30;
  d.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s}px;animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*1.5}s`;d.innerHTML=HSVG;document.body.appendChild(d);setTimeout(()=>d.remove(),7500)}}
// input
cv.tabIndex=0;
const toWorld=e=>({x:e.clientX+cam.x,y:e.clientY+cam.y});
cv.addEventListener('pointerdown',e=>{if(modal)return;ptr=true;target=toWorld(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(ptr&&!modal)target=toWorld(e)});
const up=()=>{ptr=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
mn.addEventListener('pointerdown',e=>{if(modal)return;const r=mn.getBoundingClientRect();target={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};ptr=false});
const KM={ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1,w:1,a:1,s:1,d:1,W:1,A:1,S:1,D:1};
addEventListener('keydown',e=>{if(e.key==='Escape'&&modal&&card.querySelector('.x'))return close();if(modal)return;if(KM[e.key]){keys[e.key.length===1?e.key.toLowerCase():e.key]=true;e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
addEventListener('blur',()=>{keys={}});
veil.addEventListener('click',e=>{if(e.target===veil&&card.querySelector('.x'))close()});
document.getElementById('journalBtn').onclick=()=>{if(!modal)journal()};
hud();
const back=got.length>0&&got.length<50;
show(`<div class="sym" aria-hidden="true">🗺️</div><h2>${back?'Welcome back, love':'Happy anniversary, love'}</h2>
 <p class="intro">${back?`You’ve found ${got.length} of 50 so far. The rest are still out there waiting for you.`:
 'I hid fifty things I love about you across three little lands: Your kindness, You in general, and Experiences together. Walk around and find every one.'}</p>
 <p class="intro" style="font-size:14px">Walk with the arrow keys or WASD, or tap and hold where you want to go. Glowing things are memories. Tap the map in the corner to travel there.</p>
 <div class="acts"><button class="btn" id="st">${back?'Keep exploring':'Start exploring'}</button></div>`,false);
document.getElementById('st').onclick=close;
requestAnimationFrame(loop);
}
</script>
</body>
</html>
